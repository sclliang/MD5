name: Probe Gitee

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          echo "=== HTTPS gitee.com ==="
          timeout 40 curl -sS --connect-timeout 25 -o /dev/null -w "http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" https://gitee.com || echo "HTTPS-FAIL"
          echo "=== git endpoint ==="
          timeout 40 curl -sS --connect-timeout 25 -o /dev/null -w "http=%{http_code}\n" "https://gitee.com/sclliang/MD5.git/info/refs?service=git-upload-pack" || echo "GIT-FAIL"
          echo "=== SSH port 22 ==="
          timeout 15 bash -c '</dev/tcp/gitee.com/22' && echo "SSH22-OK" || echo "SSH22-FAIL"
          echo "=== altssh port 443 ==="
          timeout 15 bash -c '</dev/tcp/altssh.gitee.com/443' && echo "ALTSSH443-OK" || echo "ALTSSH443-FAIL"
          echo "=== DNS ==="
          getent hosts gitee.com altssh.gitee.com || true
